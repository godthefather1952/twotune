name: Build and test EvolutionVox
on:
  push:
  workflow_dispatch:
jobs:
  dsp-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone DSP tests
        run: cmake -S . -B build-dsp -DEVOLUTIONVOX_BUILD_PLUGIN=OFF -DEVOLUTIONVOX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-dsp --parallel 4
      - name: Test
        run: ctest --test-dir build-dsp --output-on-failure

  vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: EvolutionVox-macOS-VST3
          - os: windows-2022
            artifact: EvolutionVox-Windows-VST3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEVOLUTIONVOX_BUILD_PLUGIN=ON -DEVOLUTIONVOX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/EvolutionVox_artefacts/**/VST3/**
          if-no-files-found: error
